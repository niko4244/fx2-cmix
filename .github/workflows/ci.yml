name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  # workflow_dispatch runs only the manual `profile` job below; the four
  # correctness jobs are gated to push/PR so a manual re-profile stays fast.
  linux-build-test:
    name: Linux (clang-17) build + round-trip tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-17, make, upx-ucl
        run: |
          set -euo pipefail
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get update
          sudo apt-get install -y upx-ucl make

      # core-avx2 (Haswell) is the CI baseline: fxcmv1.cpp needs AVX2, and a
      # fixed march keeps compressed output reproducible across runner models.
      - name: Build cmix + remap
        run: |
          set -euo pipefail
          make cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000" -j2
          make remap MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000"

      # Real lossless round-trips (the PPMd heap-remap crash is fixed and
      # byte-neutrality is guarded by the dedicated jobs below, so the old
      # gdb/time-v probe steps were dropped).
      - name: Round-trip tests (-n, -c, dictionary)
        run: |
          set -euo pipefail
          ./cmix -n prof_input/input /tmp/out_n.bin
          ./cmix -d /tmp/out_n.bin /tmp/back_n.bin
          cmp prof_input/input /tmp/back_n.bin
          echo "PASS no-preprocess round-trip"
          ./cmix -c prof_input/input /tmp/out_pgo.bin
          ./cmix -d /tmp/out_pgo.bin /tmp/back_pgo.bin
          cmp prof_input/input /tmp/back_pgo.bin
          echo "PASS PGO-path round-trip"
          ./cmix -c dictionary/english.dic prof_input/input /tmp/out_c.bin
          ./cmix -d dictionary/english.dic /tmp/out_c.bin /tmp/back_c.bin
          cmp prof_input/input /tmp/back_c.bin
          echo "PASS dictionary round-trip"

  windows-mingw-build:
    name: Windows (MinGW clang) build + round-trip tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 / MinGW64 with clang
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            diffutils
            coreutils
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-make
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-winpthreads

      # mmap_to_disk is true by default on Windows now (mman_shim.h is
      # validated by these round-trips); the script also doubles as the
      # documented way to build a native Windows release locally.
      - name: Build native Windows release
        run: |
          bash tools/build_windows.sh

      - name: Round-trip tests (-n and dictionary, exercises mman_shim.h)
        run: |
          CMIX="./$(ls cmix.exe 2>/dev/null || echo cmix)"
          "$CMIX" -n prof_input/input out_n.bin
          "$CMIX" -d out_n.bin back_n.bin
          cmp prof_input/input back_n.bin
          echo "PASS no-preprocess round-trip (mmap_to_disk on)"
          "$CMIX" -c dictionary/english.dic prof_input/input out_c.bin
          "$CMIX" -d dictionary/english.dic out_c.bin back_c.bin
          cmp prof_input/input back_c.bin
          echo "PASS dictionary round-trip (mmap_to_disk on)"

      - name: Upload native Windows binary (cmix.exe)
        uses: actions/upload-artifact@v4
        with:
          name: fx2-cmix-windows-x64
          path: cmix.exe
          if-no-files-found: error
          retention-days: 14

  # Empirically proves the PPMd heap-remap fix (commit 2eeda28) is
  # content-transparent: the pre-fix commit and the fixed HEAD must produce
  # byte-identical compressed output for the same input. The pre-fix build
  # carries the known intermittent crash, so it is retried; if it crashes
  # every time that demonstrates the bug on the unfixed code instead.
  ppm-fix-neutrality:
    name: PPMd fix output-neutrality
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (full history for the parent commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-17, make
        run: |
          set -euo pipefail
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get update
          sudo apt-get install -y make

      - name: Build fixed HEAD and compress
        run: |
          set -euo pipefail
          make cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000" -j2
          ./cmix -n prof_input/input /tmp/fixed.bin

      - name: Build pre-fix commit (2eeda28^, has the PPMd remap)
        run: |
          set -euo pipefail
          git worktree add /tmp/old 2eeda28^ 2>/dev/null || true
          make -C /tmp/old cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000" -j2

      - name: Compress with pre-fix build (retry on the known crash)
        run: |
          set +e
          ok=0
          for i in $(seq 1 6); do
            timeout 120 /tmp/old/cmix -n prof_input/input /tmp/old.bin >/dev/null 2>&1
            if [ $? -eq 0 ] && [ -s /tmp/old.bin ]; then ok=1; echo "pre-fix build compressed successfully on try $i"; break; fi
            echo "pre-fix try $i failed (known PPMd remap crash)"
          done
          if [ "$ok" -ne 1 ]; then
            echo "PRE-FIX BUILD CRASHED 6/6 — PPMd remap bug reproduced on unfixed code"
          fi
          if [ "$ok" -eq 1 ]; then
            set -e
            cmp /tmp/fixed.bin /tmp/old.bin \
              && echo "PASS: PPMd fix is byte-neutral (identical compressed output)" \
              || { echo "FAIL: compressed output differs — the fix changed behavior"; exit 1; }
          else
            # The remap makes the pre-fix build unusable here, so prove
            # byte-identity with mmap_to_disk off on BOTH commits (same
            # code paths, no remap in either).
            set -e
            echo "Rebuilding both commits with mmap_to_disk off for a byte-identity comparison..."
            make -C /tmp/old clean
            make -C /tmp/old cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000 -DMMAP_TO_DISK_DEFAULT=false" -j2
            /tmp/old/cmix -n prof_input/input /tmp/old_off.bin
            make clean
            make cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000 -DMMAP_TO_DISK_DEFAULT=false" -j2
            ./cmix -n prof_input/input /tmp/fixed_off.bin
            cmp /tmp/fixed_off.bin /tmp/old_off.bin \
              && echo "PASS: pre-fix and fixed builds are byte-identical (mmap_to_disk off)" \
              || { echo "FAIL: byte-identity check failed"; exit 1; }
          fi

  # Manual-only gprof profile (workflow_dispatch): never runs on normal
  # pushes, so the trimmed workflow stays fast. Builds with PROFILE=1 (-pg)
  # and reports the top self-time functions on prof_input/input2, so future
  # "safe speedup" work always starts from fresh data on the current tree.
  profile:
    name: gprof profile (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-17, make, binutils
        run: |
          set -euo pipefail
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get update
          sudo apt-get install -y make binutils

      - name: Build with gprof instrumentation (make PROFILE=1)
        run: |
          set -euo pipefail
          make cmix MARCH=core-avx2 PROFILE=1 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000" -j2

      - name: Run profile pass on prof_input/input2
        run: |
          set -euo pipefail
          ./cmix -n prof_input/input2 /tmp/profile_out.bin 2>&1 | tail -2

      - name: gprof flat profile (top 35 by self time)
        run: |
          gprof ./cmix gmon.out 2>/dev/null | sed -n '/Flat profile:/,/Call graph/p' | head -45
          gprof ./cmix gmon.out > /tmp/gprof_full.txt 2>/dev/null || true

      - name: Upload full profile report
        uses: actions/upload-artifact@v4
        with:
          name: gprof-report
          path: /tmp/gprof_full.txt
          if-no-files-found: error
          retention-days: 14

  # Manual-only disassembly of the production Linux codegen (workflow_dispatch):
  # dumps the exact reduction trees the compiler emits for the LSTM loops
  # (vector width, FMA contraction, accumulator count, final combine order,
  # scalar tails). A byte-exact rewrite must reproduce these operation
  # sequences exactly, so we extract them instead of guessing.
  disasm:
    name: LSTM disassembly (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-17, make, binutils
        run: |
          set -euo pipefail
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get update
          sudo apt-get install -y make binutils

      # DEBUG=1 keeps -O3 (identical codegen) but leaves symbols in, so the
      # LSTM functions can be located by name in the disassembly.
      - name: Build production binary (DEBUG=1, symbols kept)
        run: |
          set -euo pipefail
          make cmix MARCH=core-avx2 DEBUG=1 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000" -j2

      # Decisive experiment: does clang's fast-math v8f32 reduction (the
      # vshufpd/vmovshdup/vaddss tail) compute the true sum? Compile the
      # same dot-product loop both ways with the production flags and print.
      - name: Test clang-17 reduction semantics (harness, -fno-inline)
        run: |
          set -euo pipefail
          # -fno-inline: every old_*/new_* harness function compiles standalone,
          # so the oracle is context-independent (no inliner-driven FP lowering
          # differences between runs or between harness and a future edit). The
          # codegen dump below then verifies each pair at the instruction level.
          # redtest exits non-zero on any verdict outside its documented
          # expected-failure registry (tools/redtest.cpp, kExpectedDiff), so a
          # genuine regression fails this step instead of being relabeled.
          clang++-17 -O3 -march=core-avx2 -ffp-model=fast -fno-inline -std=c++17 -DUPDATE_LIMIT=3000 tools/redtest.cpp -o /tmp/redtest
          /tmp/redtest
          echo "===== harness codegen: old_* vs new_* (instruction-level oracle) ====="
          objdump -d --no-show-raw-insn -M intel -C /tmp/redtest | awk '/^[0-9a-f]+ <.*>:$/ { sub(/^[0-9a-f]+ </,""); sub(/>:$/,""); show = ($0 ~ /^old_/ || $0 ~ /^new_/) } show { print }'

      - name: Dump LSTM reduction codegen
        run: |
          set -euo pipefail
          objdump -d --no-show-raw-insn -M intel -C ./cmix > /tmp/full.dis
          # Rank functions by FMA density — this is where the reduction
          # loops live (LSTM functions are inlined into Predictor methods).
          awk '/^[0-9a-f]+ <[^>]*>:$/ { cur=$0; sub(/^.*</,"",cur); sub(/:$/,"",cur) }
               /vfmadd/ { cnt[cur]++ }
               END { for (f in cnt) print cnt[f], f }' /tmp/full.dis | sort -rn | head -15
          echo "===== LSTM function bodies (Lstm* symbols) ====="
          awk '/^[0-9a-f]+ <[^>]*>:$/ { in_fn = ($0 ~ /Lstm/) }
               in_fn { print }' /tmp/full.dis

      - name: Dump rodata floats near the LSTM constants
        run: |
          set -euo pipefail
          echo "===== HEAD .rodata (full section: folded FP literals) ====="
          objdump -s -j .rodata ./cmix
          # Also dump the ORIGINAL (identity-baseline) build's rodata: the
          # LSTM Adam/LayerNorm Newton constants are folded literals whose
          # exact values must be frozen by the reconstruction. The baseline
          # commit carries the pre-reconstruction codegen.
          # GitHub only accepts full SHAs as fetch refs (abbreviated SHAs are
          # not refs), so use the full 40-char SHA of the identity baseline.
          git fetch origin a45952be96eb76cf2930b9da9b3c2536b2c3075a --depth=1
          git worktree add --detach /tmp/base a45952be96eb76cf2930b9da9b3c2536b2c3075a
          make -C /tmp/base cmix MARCH=core-avx2 DEBUG=1 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000" -j2
          echo "===== BASELINE a45952b .rodata (full section) ====="
          objdump -s -j .rodata /tmp/base/cmix
          # The baseline is the PRE-RECONSTRUCTION tree (the identity
          # baseline): its full disasm is the authoritative oracle for every
          # reconstructed FP site. Build it with symbols kept so the LSTM
          # functions can be located by name.
          echo "===== BASELINE a45952b full disasm ====="
          objdump -d --no-show-raw-insn -M intel -C /tmp/base/cmix > /tmp/base.dis

      - name: Upload full disassembly
        uses: actions/upload-artifact@v4
        with:
          name: lstm-disasm
          path: |
            /tmp/full.dis
            /tmp/base.dis
          if-no-files-found: error
          retention-days: 14

  # Every push must produce byte-identical compressed output to its parent
  # commit (same platform, same flags). Guards the "safe speedups" work: any
  # optimization that changes the compressed bytes fails CI and is reverted.
  # (Re-profile on the current tree via the manual `profile` job above.)
  output-identity:
    name: Output identity (HEAD vs parent)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (full history for the parent commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-17, make
        run: |
          set -euo pipefail
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get update
          sudo apt-get install -y make

      - name: Build HEAD and compress prof_input/input2
        run: |
          set -euo pipefail
          make cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000" -j2
          ./cmix -n prof_input/input2 /tmp/head.bin 2>&1 | tail -1

      # Compare against the parent commit by default, or against an explicit
      # baseline named in the commit message ("Identity-baseline: <sha>") —
      # used when the parent is itself known-broken and a direct comparison
      # against a known-good commit is the meaningful check.
      - name: Determine comparison baseline
        run: |
          set -euo pipefail
          BASELINE=$(git log -1 --format='%B' | grep -oE '^Identity-baseline: [0-9a-f]{7,40}' | awk '{print $2}' || true)
          if [ -z "$BASELINE" ]; then BASELINE="HEAD~1"; fi
          echo "baseline=$BASELINE" >> "$GITHUB_ENV"
          echo "comparing HEAD against $BASELINE"

      - name: Build baseline commit and compress
        run: |
          set -euo pipefail
          git worktree add /tmp/old "$baseline" 2>/dev/null || true
          make -C /tmp/old cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000" -j2
          /tmp/old/cmix -n prof_input/input2 /tmp/parent.bin 2>&1 | tail -1

      - name: Compare compressed bytes
        run: |
          set -euo pipefail
          cmp /tmp/head.bin /tmp/parent.bin \
            && echo "PASS: HEAD and $baseline produce byte-identical compressed output" \
            || { echo "FAIL: compressed output differs from $baseline — revert or fix"; exit 1; }

  # Same-run wall-clock A/B: build HEAD and its parent in one job and time
  # both interleaved on the SAME runner. Cross-run totals on shared runners
  # are too noisy to be useful (measured: 117s vs 125s for byte-identical
  # code), but an interleaved same-job comparison cancels drift and gives a
  # stable delta for speedup/regression work. Informational only — the
  # output-identity job remains the correctness gate.
  benchmark:
    name: Wall-clock benchmark (HEAD vs baseline, same-run A/B)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (full history for the baseline commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-17, make
        run: |
          set -euo pipefail
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get update
          sudo apt-get install -y make

      # Compare against the parent commit by default, or against an explicit
      # baseline named in the commit message ("Benchmark-baseline: <sha>") —
      # mirrors the Identity-baseline override, and lets one same-run A/B
      # measure a whole accumulated change set against a known-good tree
      # instead of only the latest commit.
      - name: Determine comparison baseline
        run: |
          set -euo pipefail
          BASELINE=$(git log -1 --format='%B' | grep -oE '^Benchmark-baseline: [0-9a-f]{7,40}' | awk '{print $2}' || true)
          if [ -z "$BASELINE" ]; then BASELINE="HEAD~1"; fi
          echo "baseline=$BASELINE" >> "$GITHUB_ENV"
          echo "comparing HEAD against $BASELINE"

      - name: Build HEAD and baseline
        run: |
          set -euo pipefail
          make cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000" -j2
          git worktree add /tmp/old "$baseline" 2>/dev/null || true
          make -C /tmp/old cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000" -j2

      # Interleaved timing (HEAD, baseline, HEAD, baseline, HEAD, baseline)
      # so thermal/co-tenant drift affects both equally; min-of-3 per
      # binary cancels cold-start and occasional outliers better than
      # min-of-2 did, and the per-rep spread (max-min, as % of the min)
      # reports how noisy this particular run was. The delta is
      # informational: shared-runner noise is a few percent, so treat only
      # large or repeated deltas as significant.
      - name: Interleaved wall-clock A/B on prof_input/input
        run: |
          set -euo pipefail
          run_one() {
            local bin=$1 out=$2 start end
            start=$(date +%s%N)
            "$bin" -n prof_input/input "$out" >/dev/null 2>&1
            end=$(date +%s%N)
            echo $(( (end - start) / 1000000 ))
          }
          h1=$(run_one ./cmix /tmp/h1.bin)
          o1=$(run_one /tmp/old/cmix /tmp/o1.bin)
          h2=$(run_one ./cmix /tmp/h2.bin)
          o2=$(run_one /tmp/old/cmix /tmp/o2.bin)
          h3=$(run_one ./cmix /tmp/h3.bin)
          o3=$(run_one /tmp/old/cmix /tmp/o3.bin)
          h=$h1; [ "$h2" -lt "$h" ] && h=$h2; [ "$h3" -lt "$h" ] && h=$h3
          o=$o1; [ "$o2" -lt "$o" ] && o=$o2; [ "$o3" -lt "$o" ] && o=$o3
          hmax=$h1; [ "$h2" -gt "$hmax" ] && hmax=$h2; [ "$h3" -gt "$hmax" ] && hmax=$h3
          omax=$o1; [ "$o2" -gt "$omax" ] && omax=$o2; [ "$o3" -gt "$omax" ] && omax=$o3
          HSP=$(awk "BEGIN{printf \"%d ms (%.1f%%)\", $((hmax-h)), ($hmax-$h)/$h*100}")
          OSP=$(awk "BEGIN{printf \"%d ms (%.1f%%)\", $((omax-o)), ($omax-$o)/$o*100}")
          DELTA=$(awk "BEGIN{printf \"%+.1f%%\", ($h-$o)/$o*100}")
          # If a binary's own reps scatter >5%, a ~1-2% delta cannot be
          # meaningfully resolved on this run — say so in the report.
          if [ $((hmax-h)) -gt $((h/20)) ] || [ $((omax-o)) -gt $((o/20)) ]; then
            FLAG=" (high rep spread — delta not reliable below ~5%)"
          else
            FLAG=""
          fi
          echo "HEAD compression time:    ${h} ms (reps $h1, $h2, $h3; spread $HSP)"
          echo "Baseline compression:     ${o} ms (reps $o1, $o2, $o3; spread $OSP)  [$baseline]"
          echo "delta (HEAD vs baseline): $DELTA  (negative = faster)$FLAG"
          printf 'HEAD=%s ms (reps %s,%s,%s; spread %s)\nBASELINE=%s ms (reps %s,%s,%s; spread %s) [%s]\nDELTA=%s%s\n' \
            "$h" "$h1" "$h2" "$h3" "$HSP" "$o" "$o1" "$o2" "$o3" "$OSP" "$baseline" "$DELTA" "$FLAG" > benchmark-report.txt
          echo "report written to benchmark-report.txt"

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.txt
          if-no-files-found: error
          retention-days: 14

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  linux-build-test:
    name: Linux (clang-17) build + round-trip tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-17, make, upx-ucl
        run: |
          set -euo pipefail
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get update
          sudo apt-get install -y upx-ucl make

      # core-avx2 (Haswell) is the CI baseline: fxcmv1.cpp needs AVX2, and a
      # fixed march keeps compressed output reproducible across runner models.
      - name: Build cmix + remap
        run: |
          set -euo pipefail
          make cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000" -j2
          make remap MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000"

      # Real lossless round-trips (the PPMd heap-remap crash is fixed and
      # byte-neutrality is guarded by the dedicated jobs below, so the old
      # gdb/time-v probe steps were dropped).
      - name: Round-trip tests (-n, -c, dictionary)
        run: |
          set -euo pipefail
          ./cmix -n prof_input/input /tmp/out_n.bin
          ./cmix -d /tmp/out_n.bin /tmp/back_n.bin
          cmp prof_input/input /tmp/back_n.bin
          echo "PASS no-preprocess round-trip"
          ./cmix -c prof_input/input /tmp/out_pgo.bin
          ./cmix -d /tmp/out_pgo.bin /tmp/back_pgo.bin
          cmp prof_input/input /tmp/back_pgo.bin
          echo "PASS PGO-path round-trip"
          ./cmix -c dictionary/english.dic prof_input/input /tmp/out_c.bin
          ./cmix -d dictionary/english.dic /tmp/out_c.bin /tmp/back_c.bin
          cmp prof_input/input /tmp/back_c.bin
          echo "PASS dictionary round-trip"

  windows-mingw-build:
    name: Windows (MinGW clang) build + round-trip tests
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 / MinGW64 with clang
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            diffutils
            coreutils
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-make
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-winpthreads

      # mmap_to_disk is true by default on Windows now (mman_shim.h is
      # validated by these round-trips); the script also doubles as the
      # documented way to build a native Windows release locally.
      - name: Build native Windows release
        run: |
          bash tools/build_windows.sh

      - name: Round-trip tests (-n and dictionary, exercises mman_shim.h)
        run: |
          CMIX="./$(ls cmix.exe 2>/dev/null || echo cmix)"
          "$CMIX" -n prof_input/input out_n.bin
          "$CMIX" -d out_n.bin back_n.bin
          cmp prof_input/input back_n.bin
          echo "PASS no-preprocess round-trip (mmap_to_disk on)"
          "$CMIX" -c dictionary/english.dic prof_input/input out_c.bin
          "$CMIX" -d dictionary/english.dic out_c.bin back_c.bin
          cmp prof_input/input back_c.bin
          echo "PASS dictionary round-trip (mmap_to_disk on)"

      - name: Upload native Windows binary (cmix.exe)
        uses: actions/upload-artifact@v4
        with:
          name: fx2-cmix-windows-x64
          path: cmix.exe
          if-no-files-found: error
          retention-days: 14

  # Empirically proves the PPMd heap-remap fix (commit 2eeda28) is
  # content-transparent: the pre-fix commit and the fixed HEAD must produce
  # byte-identical compressed output for the same input. The pre-fix build
  # carries the known intermittent crash, so it is retried; if it crashes
  # every time that demonstrates the bug on the unfixed code instead.
  ppm-fix-neutrality:
    name: PPMd fix output-neutrality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (full history for the parent commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-17, make
        run: |
          set -euo pipefail
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get update
          sudo apt-get install -y make

      - name: Build fixed HEAD and compress
        run: |
          set -euo pipefail
          make cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000" -j2
          ./cmix -n prof_input/input /tmp/fixed.bin

      - name: Build pre-fix commit (2eeda28^, has the PPMd remap)
        run: |
          set -euo pipefail
          git worktree add /tmp/old 2eeda28^ 2>/dev/null || true
          make -C /tmp/old cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000" -j2

      - name: Compress with pre-fix build (retry on the known crash)
        run: |
          set +e
          ok=0
          for i in $(seq 1 6); do
            timeout 120 /tmp/old/cmix -n prof_input/input /tmp/old.bin >/dev/null 2>&1
            if [ $? -eq 0 ] && [ -s /tmp/old.bin ]; then ok=1; echo "pre-fix build compressed successfully on try $i"; break; fi
            echo "pre-fix try $i failed (known PPMd remap crash)"
          done
          if [ "$ok" -ne 1 ]; then
            echo "PRE-FIX BUILD CRASHED 6/6 — PPMd remap bug reproduced on unfixed code"
          fi
          if [ "$ok" -eq 1 ]; then
            set -e
            cmp /tmp/fixed.bin /tmp/old.bin \
              && echo "PASS: PPMd fix is byte-neutral (identical compressed output)" \
              || { echo "FAIL: compressed output differs — the fix changed behavior"; exit 1; }
          else
            # The remap makes the pre-fix build unusable here, so prove
            # byte-identity with mmap_to_disk off on BOTH commits (same
            # code paths, no remap in either).
            set -e
            echo "Rebuilding both commits with mmap_to_disk off for a byte-identity comparison..."
            make -C /tmp/old clean
            make -C /tmp/old cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000 -DMMAP_TO_DISK_DEFAULT=false" -j2
            /tmp/old/cmix -n prof_input/input /tmp/old_off.bin
            make clean
            make cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000 -DMMAP_TO_DISK_DEFAULT=false" -j2
            ./cmix -n prof_input/input /tmp/fixed_off.bin
            cmp /tmp/fixed_off.bin /tmp/old_off.bin \
              && echo "PASS: pre-fix and fixed builds are byte-identical (mmap_to_disk off)" \
              || { echo "FAIL: byte-identity check failed"; exit 1; }
          fi

  # Every push must produce byte-identical compressed output to its parent
  # commit (same platform, same flags). Guards the "safe speedups" work: any
  # optimization that changes the compressed bytes fails CI and is reverted.
  # (The one-off gprof profile job that drove this work was removed; run
  # `make cmix PROFILE=1` locally to re-profile.)
  output-identity:
    name: Output identity (HEAD vs parent)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (full history for the parent commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-17, make
        run: |
          set -euo pipefail
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get update
          sudo apt-get install -y make

      - name: Build HEAD and compress prof_input/input2
        run: |
          set -euo pipefail
          make cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000" -j2
          ./cmix -n prof_input/input2 /tmp/head.bin 2>&1 | tail -1

      - name: Build parent commit and compress
        run: |
          set -euo pipefail
          git worktree add /tmp/old HEAD~1 2>/dev/null || true
          make -C /tmp/old cmix MARCH=core-avx2 CFLAGS_DEFINES="-DSEED=923 -DUPDATE_LIMIT=3000" -j2
          /tmp/old/cmix -n prof_input/input2 /tmp/parent.bin 2>&1 | tail -1

      - name: Compare compressed bytes
        run: |
          set -euo pipefail
          cmp /tmp/head.bin /tmp/parent.bin \
            && echo "PASS: HEAD and parent produce byte-identical compressed output" \
            || { echo "FAIL: compressed output differs from parent — revert or fix"; exit 1; }
